<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cozyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="warmRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Nền Squircle ấm cúng -->
  <rect x="6" y="6" width="116" height="116" rx="34" fill="url(#cozyBg)" stroke="url(#warmRim)" stroke-width="2"/>

  <!-- Tách cà phê Lo-fi Cozy -->
  <path d="M 36 56 H 82 V 76 C 82 88, 36 88, 36 76 Z" fill="url(#amberGrad)"/>
  
  <!-- Quai tách cà phê -->
  <path d="M 82 62 C 92 62, 92 74, 82 74" fill="none" stroke="url(#amberGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Đĩa lót tách -->
  <path d="M 30 92 H 88" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>

  <!-- Làn khói uốn lượn phong cách Lo-fi chill -->
  <path d="M 48 46 C 44 38, 52 32, 48 24" fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 64 48 C 60 38, 68 30, 64 20" fill="none" stroke="#fed7aa" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 76 44 C 74 38, 78 34, 76 28" fill="none" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Nốt nhạc bay lơ lửng -->
  <circle cx="94" cy="36" r="3.5" fill="#fbbf24"/>
  <path d="M 97 36 V 26 H 105 V 30" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
</svg>
