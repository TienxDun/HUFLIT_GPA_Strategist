<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryShape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentShape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Nền Monogram vuông bo cong siêu nét -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#bgGrad)" stroke="url(#rimStroke)" stroke-width="2"/>

  <!-- Chữ 'H' (HUFLIT) & Khối tăng trưởng GPA lồng ghép hình học -->
  <!-- Cột trái -->
  <rect x="32" y="32" width="18" height="64" rx="9" fill="url(#primaryShape)"/>
  
  <!-- Cột phải vươn cao tượng trưng bứt phá -->
  <rect x="78" y="24" width="18" height="72" rx="9" fill="url(#accentShape)"/>
  
  <!-- Cầu nối trung tâm dốc chéo góc 45 độ -->
  <path d="M 44 64 L 84 48" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Điểm nhấn tròn tương tác cao cấp -->
  <circle cx="87" cy="24" r="5" fill="#fef08a"/>
</svg>
